<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023645"/>
      <stop offset="40%" stop-color="#03546A"/>
      <stop offset="100%" stop-color="#01222C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#057594" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#03546A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo Emblem -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="18" fill="#03546A" stroke="#DEDEDE" stroke-opacity="0.5" stroke-width="2"/>
    <text x="36" y="47" font-family="'Outfit', sans-serif, system-ui" font-weight="900" font-size="28" fill="#DEDEDE" text-anchor="middle">SZAL</text>
    <text x="96" y="38" font-family="'Outfit', sans-serif, system-ui" font-weight="800" font-size="28" fill="#FFFFFF">SZAL ÇALIŞTAYI</text>
    <text x="96" y="60" font-family="'Inter', sans-serif, system-ui" font-weight="600" font-size="16" fill="#DEDEDE" letter-spacing="2">SABAHATTİN ZAİM ANADOLU LİSESİ</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="270" font-family="'Outfit', sans-serif, system-ui" font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-1">SZAL Çalıştayı 2027</text>
  
  <!-- Slogan -->
  <text x="100" y="330" font-family="'Outfit', sans-serif, system-ui" font-weight="600" font-size="28" fill="#DEDEDE">Geleceğin Liderleri, Bugünün Fikirleriyle Buluşuyor.</text>

  <!-- Meta Badges -->
  <g transform="translate(100, 420)">
    <!-- Date badge -->
    <rect width="260" height="56" rx="28" fill="#023645" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="130" y="35" font-family="'Inter', sans-serif, system-ui" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">24-25 Nisan 2027</text>

    <!-- Venue badge -->
    <g transform="translate(280, 0)">
      <rect width="420" height="56" rx="28" fill="#023645" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
      <text x="210" y="35" font-family="'Inter', sans-serif, system-ui" font-weight="600" font-size="18" fill="#FFFFFF" text-anchor="middle">Sabahattin Zaim Üniversitesi</text>
    </g>
  </g>

  <!-- Call to Action note -->
  <text x="100" y="550" font-family="'Inter', sans-serif, system-ui" font-weight="500" font-size="18" fill="#E6F1F4" opacity="0.8">Lise öğrencileri için iki günlük vizyon, atölye ve ilham çalıştayı.</text>
</svg>
